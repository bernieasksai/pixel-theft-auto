</head><body><canvas id="c"></canvas>
<script>
'use strict';
// ======================================================================
//  PIXEL THEFT AUTO  -  single-file GTA2-style top-down action game
// ======================================================================
const TAU=Math.PI*2, PI=Math.PI;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const buf=document.createElement('canvas'), g=buf.getContext('2d');
let W=0,H=0,PIX=2,LW=320,LH=180,U=1,HIRES=true;try{HIRES=localStorage.getItem('pta_lores')!=='1';}catch(e){}
function resize(){
  W=cv.width=Math.max(320,innerWidth); H=cv.height=Math.max(200,innerHeight);
  PIX=HIRES?Math.max(1,Math.round(H/600)):Math.max(2,Math.round(H/330)); LW=Math.ceil(W/PIX); LH=Math.ceil(H/PIX);
  buf.width=LW; buf.height=LH; U=Math.max(0.55,Math.min(W/1280,H/720));
  ctx.imageSmoothingEnabled=false; g.imageSmoothingEnabled=false;
}
addEventListener('resize',resize); resize();

// ---------- utils ----------
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const R=Math.random, rr=(a,b)=>a+R()*(b-a), ri=(a,b)=>Math.floor(a+R()*(b-a+1)), pick=a=>a[Math.floor(R()*a.length)];
const angDiff=(a,b)=>{let d=(a-b)%TAU; if(d>PI)d-=TAU; if(d<-PI)d+=TAU; return d;};
const DX=[1,0,-1,0], DY=[0,1,0,-1];
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash2(x,y){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296;}
function hexRGB(h){h=h.replace('#','');return[parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
function shade(h,f){return 'rgb('+hexRGB(h).map(v=>clamp(Math.round(v*f),0,255)).join(',')+')';}
function segCircle(x0,y0,x1,y1,cx,cy,r){const dx=x1-x0,dy=y1-y0,l2=dx*dx+dy*dy||1;let t=((cx-x0)*dx+(cy-y0)*dy)/l2;t=clamp(t,0,1);const px=x0+dx*t-cx,py=y0+dy*t-cy;return px*px+py*py<r*r;}

// ---------- city ----------
const T=32,P=12,B=10,NB=12,CITYN=B*P+2,N=NB*P+2,WORLD=N*T;
const ROAD=0,SIDE=1,BLD=2,GRASS=3,WATER=4,LOT=5,ALLEY=6;
const map=new Uint8Array(N*N), buildings=[], trees=[], lotSlots=[];
const tileAt=(tx,ty)=>(tx<0||ty<0||tx>=N||ty>=N)?BLD:map[ty*N+tx];
const tileW=(x,y)=>tileAt(Math.floor(x/T),Math.floor(y/T));
const solid=t=>t===BLD||t===WATER;
const walkable=t=>t===SIDE||t===ALLEY||t===GRASS||t===LOT;
const DISTRICTS=[
 {name:'DOWNTOWN',park:.06,lot:.08,water:.02,hmin:.28,hmax:.55,big:.55,walls:['#7d8796','#8e8a80','#6a7488','#9aa2ae','#5e6878','#84786a']},
 {name:'OLD TOWN',park:.14,lot:.08,water:.05,hmin:.12,hmax:.26,big:.12,walls:['#a0624a','#b07a50','#8a5a48','#c09060','#986850','#7a6a58']},
 {name:'INDUSTRIAL',park:.04,lot:.26,water:.06,hmin:.09,hmax:.2,big:.7,walls:['#6e6a5e','#7a7260','#5c6066','#857a64','#6a7060']},
 {name:'RIVERSIDE',park:.2,lot:.08,water:.18,hmin:.12,hmax:.3,big:.2,walls:['#c8b898','#a8b0a0','#b89888','#9ab0b8','#b0a080']}];
const districtAt=(x,y)=>(x>=CITYN*T||y>=CITYN*T)?4:(x<CITYN*T/2?0:1)+(y<CITYN*T/2?0:2);
function genCity(){
  const rnd=mulberry32(90210);
  for(let ty=0;ty<N;ty++)for(let tx=0;tx<N;tx++){const mx=tx%P,my=ty%P;let t;
    if(mx<2||my<2)t=ROAD;else if(mx===2||mx===P-1||my===2||my===P-1)t=SIDE;else t=ALLEY;map[ty*N+tx]=t;}
  const rp=a=>a[Math.floor(rnd()*a.length)];
  for(let by=0;by<B;by++)for(let bx=0;bx<B;bx++){
    const ox=bx*P+3, oy=by*P+3, D=DISTRICTS[(bx<B/2?0:1)+(by<B/2?0:2)];
    const rect=(x,y,w,h,t)=>{for(let j=0;j<h;j++)for(let i=0;i<w;i++)map[(oy+y+j)*N+ox+x+i]=t;};
    const addB=(x,y,w,h)=>{rect(x,y,w,h,BLD);const wall=rp(D.walls);const ht=(D.hmin+rnd()*(D.hmax-D.hmin))*(w*h<20?.85:1);
      const bd={x0:(ox+x)*T,y0:(oy+y)*T,x1:(ox+x+w)*T,y1:(oy+y+h)*T,h:ht,floors:Math.max(1,Math.round(ht*10)),seed:(rnd()*1e6)|0,
        wN:shade(wall,.95),wS:shade(wall,.6),wE:shade(wall,.72),wW:shade(wall,.84),roof:shade(wall,1.2),rim:shade(wall,.88),det:[],heli:false};
      const nd=1+Math.floor(rnd()*4);
      for(let i=0;i<nd;i++){const dw=10+rnd()*20,dh=10+rnd()*20;bd.det.push({x:bd.x0+8+rnd()*(bd.x1-bd.x0-16-dw),y:bd.y0+8+rnd()*(bd.y1-bd.y0-16-dh),w:dw,h:dh,c:rp(['#9a9a9a','#7a7a80','#b0b0a8','#606068','#8a8070'])});}
      if(w*h>=40&&ht>.38&&rnd()<.6){bd.heli=true;bd.det=bd.det.slice(0,1);}
      buildings.push(bd);};
    let r=rnd(); if((bx===4||bx===5)&&(by===4||by===5)) r=1;
    if(r<D.park){rect(0,0,8,8,GRASS);const pond=rnd()<.35;if(pond)rect(2,2,4,4,WATER);
      const nt=5+Math.floor(rnd()*6);for(let i=0;i<nt;i++){const rx=.5+rnd()*7,ry=.5+rnd()*7;if(pond&&rx>1.5&&rx<6.5&&ry>1.5&&ry<6.5)continue;
        trees.push({x:(ox+rx)*T,y:(oy+ry)*T,r:9+rnd()*6,c:rp(['#2f7a2a','#3a8a30','#28682a','#4a9038'])});}}
    else if(r<D.park+D.lot){rect(0,0,8,8,LOT);for(let i=0;i<8;i++)for(const row of[1,6])lotSlots.push({x:(ox+i+.5)*T,y:(oy+row+.5)*T,a:(row===1?-PI/2:PI/2)+(rnd()<.5?PI:0)});}
    else if(r<D.park+D.lot+D.water){rect(0,0,8,8,GRASS);rect(1,1,6,6,WATER);
      for(let i=0;i<4;i++)trees.push({x:(ox+.5+(i%2)*7)*T,y:(oy+.5+(i>>1)*7)*T,r:10+rnd()*4,c:'#2f7a2a'});}
    else{const L=rnd(),q=(1-D.big)/3;
      if(L<D.big)addB(0,0,8,8);
      else if(L<D.big+q){const a=3+Math.floor(rnd()*2);addB(0,0,a,8);addB(a+1,0,7-a,8);}
      else if(L<D.big+2*q){const a=3+Math.floor(rnd()*2);addB(0,0,8,a);addB(0,a+1,8,7-a);}
      else{const a=3+Math.floor(rnd()*2),c=3+Math.floor(rnd()*2);addB(0,0,a,c);addB(a+1,0,7-a,c);addB(0,c+1,a,7-c);addB(a+1,c+1,7-a,7-c);}}
  }
}
genCity();
// minimap image
const mini=document.createElement('canvas');mini.width=N;mini.height=N;
(()=>{const m=mini.getContext('2d'),id=m.createImageData(N,N);const C={0:[150,150,150],1:[95,95,95],2:[44,48,58],3:[45,100,40],4:[40,70,140],5:[80,80,84],6:[70,68,66]};
 for(let i=0;i<N*N;i++){const c=C[map[i]];id.data[i*4]=c[0];id.data[i*4+1]=c[1];id.data[i*4+2]=c[2];id.data[i*4+3]=255;}m.putImageData(id,0,0);})();

// ---------- ground chunk cache ----------
const CH=8,CHP=CH*T,chunkCache=new Map();
function getChunk(cx,cy){const k=cx+cy*1000;let c=chunkCache.get(k);if(c){chunkCache.delete(k);chunkCache.set(k,c);return c;}
  c=renderChunk(cx,cy);chunkCache.set(k,c);if(chunkCache.size>90)chunkCache.delete(chunkCache.keys().next().value);return c;}
function renderChunk(cx,cy){
  const c=document.createElement('canvas');c.width=c.height=CHP;const q=c.getContext('2d');
  const img=q.createImageData(CHP,CHP),d=img.data;
  for(let py=0;py<CHP;py++){const wy=cy*CHP+py,ty=wy>>5,ly=wy&31;
    for(let px=0;px<CHP;px++){const wx=cx*CHP+px,tx=wx>>5,lx=wx&31,t=tileAt(tx,ty),n=hash2(wx,wy);let r,gg,bb,v;
      switch(t){
        case ROAD:v=54+n*10;if(hash2(wx>>2,wy>>2)>.93)v-=8;r=v;gg=v;bb=v+5;break;
        case SIDE:v=146+n*12;if(lx%16===0||ly%16===0)v-=24;r=v;gg=v-2;bb=v-7;break;
        case ALLEY:v=98+n*14;if(lx%8===0&&ly%16<2)v-=10;r=v;gg=v-5;bb=v-10;break;
        case GRASS:r=46+n*26;gg=104+n*42;bb=38+n*16;if(hash2(wx>>1,wy>>1)>.985){r=230;gg=210;bb=90;}break;
        case WATER:v=hash2(wx>>3,wy>>1);r=28+n*8;gg=76+n*12+v*10;bb=150+n*18+v*12;break;
        case LOT:v=68+n*10;r=v;gg=v;bb=v+4;break;
        default:r=gg=bb=30;}
      const i=(py*CHP+px)*4;d[i]=r;d[i+1]=gg;d[i+2]=bb;d[i+3]=255;}}
  q.putImageData(img,0,0);
  for(let j=0;j<CH;j++)for(let i=0;i<CH;i++){const tx=cx*CH+i,ty=cy*CH+j,t=tileAt(tx,ty),ox=i*T,oy=j*T,mx=tx%P,my=ty%P;
    if(tx>=N||ty>=N)continue;
    if(t===ROAD){const vert=mx<2&&my>=2,hor=my<2&&mx>=2;
      if(vert){if(my===2||my===P-1){q.fillStyle='#d8d8d0';for(let k=0;k<4;k++)q.fillRect(ox+3+k*7,oy+6,4,20);}
        else if(mx===0){q.fillStyle='#d8b030';q.fillRect(ox+T-1,oy+3,2,11);q.fillRect(ox+T-1,oy+19,2,11);}}
      if(hor){if(mx===2||mx===P-1){q.fillStyle='#d8d8d0';for(let k=0;k<4;k++)q.fillRect(ox+6,oy+3+k*7,20,4);}
        else if(my===0){q.fillStyle='#d8b030';q.fillRect(ox+3,oy+T-1,11,2);q.fillRect(ox+19,oy+T-1,11,2);}}
    }else if(t===SIDE||t===ALLEY){
      q.fillStyle='#c4c4bc';
      if(tileAt(tx-1,ty)===ROAD)q.fillRect(ox,oy,3,T);
      if(tileAt(tx+1,ty)===ROAD)q.fillRect(ox+T-3,oy,3,T);
      if(tileAt(tx,ty-1)===ROAD)q.fillRect(ox,oy,T,3);
      if(tileAt(tx,ty+1)===ROAD)q.fillRect(ox,oy+T-3,T,3);
      q.fillStyle='rgba(0,0,0,.25)';
      if(tileAt(tx-1,ty)===BLD)q.fillRect(ox,oy,5,T);
      if(tileAt(tx,ty-1)===BLD)q.fillRect(ox,oy,T,5);
    }else if(t===LOT){const rel=my-3;if(rel===1||rel===6){q.fillStyle='#d0d0c8';q.fillRect(ox,oy+(rel===1?0:4),2,T-4);if(mx===P-2)q.fillRect(ox+T-2,oy+(rel===1?0:4),2,T-4);}
    }else if(t===WATER){q.fillStyle='rgba(200,230,255,.5)';
      if(tileAt(tx-1,ty)!==WATER)q.fillRect(ox,oy,2,T);if(tileAt(tx+1,ty)!==WATER)q.fillRect(ox+T-2,oy,2,T);
      if(tileAt(tx,ty-1)!==WATER)q.fillRect(ox,oy,T,2);if(tileAt(tx,ty+1)!==WATER)q.fillRect(ox,oy+T-2,T,2);}
  }
  return c;
}

// ---------- audio ----------
let AC=null,master=null,noiseBuf=null,engOsc=null,engGain=null,sirOsc=null,sirGain=null,muted=false;
function initAudio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.35;master.connect(AC.destination);
  noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  engOsc=AC.createOscillator();engOsc.type='sawtooth';const ef=AC.createBiquadFilter();ef.type='lowpass';ef.frequency.value=380;engGain=AC.createGain();engGain.gain.value=0;
  engOsc.connect(ef);ef.connect(engGain);engGain.connect(master);engOsc.start();
  sirOsc=AC.createOscillator();sirOsc.type='square';sirGain=AC.createGain();sirGain.gain.value=0;sirOsc.connect(sirGain);sirGain.connect(master);sirOsc.start();
}catch(e){AC=null;}}
function sNoise(dur,freq,vol,type){if(!AC||muted||vol<.01)return;const t=AC.currentTime,s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type=type||'lowpass';f.frequency.value=freq;
  const gn=AC.createGain();gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(gn);gn.connect(master);s.start(t,Math.random()*.5);s.stop(t+dur+.05);}
function sTone(f0,f1,dur,vol,type){if(!AC||muted||vol<.01)return;const t=AC.currentTime,o=AC.createOscillator();o.type=type||'square';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  const gn=AC.createGain();gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(gn);gn.connect(master);o.start(t);o.stop(t+dur+.05);}
function sfx(k,x,y){if(!AC)return;const at=x===undefined?1:clamp(1-Math.hypot(x-focus.x,y-focus.y)/750,0,1);if(at<=0)return;
  switch(k){case'shot':sNoise(.12,2600,.45*at,'bandpass');sTone(200,60,.07,.25*at);break;
    case'smg':sNoise(.07,3000,.3*at,'bandpass');break;
    case'shotgun':sNoise(.28,1400,.7*at);sTone(120,40,.12,.3*at);break;
    case'boom':sNoise(1.3,520,1*at);sTone(90,28,.7,.6*at,'sine');break;
    case'crash':sNoise(.22,900,.5*at);break;
    case'splat':sNoise(.16,320,.6*at);break;
    case'pick':sTone(600,1300,.14,.2,'square');break;
    case'door':sTone(220,140,.07,.18);break;
    case'skid':sNoise(.12,2800,.07*at,'highpass');break;
    case'swing':sNoise(.08,1800,.12,'bandpass');break;
    case'punch':sNoise(.09,500,.45*at);sTone(140,60,.06,.25*at);break;
    case'cash':sTone(1200,1800,.06,.15,'square');setTimeout(()=>sTone(1600,2400,.08,.12,'square'),70);break;
    case'level':[523,659,784,1046].forEach((f,i)=>setTimeout(()=>sTone(f,f,.14,.16,'square'),i*90));break;
    case'alarm':for(let i=0;i<4;i++)setTimeout(()=>sTone(900,600,.18,.12,'sawtooth'),i*220);break;
    case'phone':sTone(880,1320,.05,.1,'sine');break;
    case'cam':sTone(1400,1400,.06,.12*at,'square');setTimeout(()=>sTone(1800,1800,.06,.12*at,'square'),90);break;
    case'rifle':sNoise(.25,2000,.6*at,'bandpass');sTone(160,40,.12,.35*at);break;
    case'hurt':sTone(300,120,.15,.2,'sawtooth');break;}}

// ---------- game data ----------
const CAR_TYPES={sedan:{L:30,W:15,max:300,acc:240,hp:100,m:1,name:'SEDAN'},sport:{L:29,W:14,max:410,acc:370,hp:80,m:.9,name:'SPORTSTER'},
  van:{L:36,W:17,max:230,acc:170,hp:150,m:1.6,name:'VAN'},taxi:{L:30,W:15,max:310,acc:250,hp:100,m:1,name:'TAXI'},police:{L:31,W:15,max:370,acc:320,hp:170,m:1.3,name:'POLICE CRUISER'}};
const CAR_COLORS=['#b02a2a','#2a5ab0','#2a8a4a','#d8d8d8','#383838','#c07a20','#7a3ab0','#20a0a0','#a09a20','#8a1a3a','#5a4a3a'];

  PANTS=['#2a2a3a','#3a3a5a','#5a4a3a','#222222','#4a5a6a'],HAIR=['#1a1208','#3a2210','#8a6a30','#202020','#c0c0c0'];
const WEAPONS=[{name:'FISTS',melee:true,rate:.32,dmg:14,range:13,ko:true,kd:.25,spread:0,pellets:1,spd:0,snd:'swing'},

 {name:'PISTOL',rate:.3,dmg:34,spread:.04,pellets:1,spd:720,snd:'shot'},{name:'S-UZI',rate:.085,dmg:20,spread:.1,pellets:1,spd:760,snd:'smg'},
 {name:'SHOTGUN',rate:.8,dmg:24,spread:.22,pellets:7,spd:650,snd:'shotgun'},{name:'RIFLE',rate:.9,dmg:95,spread:.008,pellets:1,spd:1150,snd:'rifle'}];

function makeCar(type,x,y,a){const t=CAR_TYPES[type];const col=type==='taxi'?'#e8c020':type==='police'?'#eeeeee':type==='sport'?pick(['#d02020','#e0e0e0','#2050d0','#f0a000','#101010']):pick(CAR_COLORS);

function genPOIs(){const rnd=mulberry32(4242),start={x:(5*P-1+.5)*T,y:(4*P+6+.5)*T},cands=[];

    if(tileAt(tx1+1,myT)===SIDE&&tileAt(tx1+2,myT)===ROAD)opts.push({side:3,door:{x:bd.x1,y:(myT+.5)*T},spot:{x:bd.x1+16,y:(myT+.5)*T},n:[1,0]});

    const list=near?pool.slice(0,8):pool;let ch=null;
    for(let k=0;k<60&&!ch;k++){const c=list[Math.floor(rnd()*list.length)];if(same.every(p=>Math.hypot(p.door.x-c.bd.x0,p.door.y-c.bd.y0)>1000))ch=c;}

  place('bank',c=>c.dist===0,false);place('strip',c=>c.dist===1,false);place('garage',null,false);place('chop',c=>c.dist===2,false);
  // red light district around first strip club

    for(let by=0;by<B;by++)for(let bx=0;bx<B;bx++)for(const [mx,my] of [[2,2],[11,2],[2,11],[11,11]]){const tx=bx*P+mx,ty=by*P+my,x=(tx+.5)*T,y=(ty+.5)*T;

  const okA=a=>pois.every(p=>Math.hypot(p.spot.x-a.x,p.spot.y-a.y)>50)&&atms.every(b=>Math.hypot(b.x-a.x,b.y-a.y)>650);

function updatePed(p,dt){if(p.dead){p.deadT+=dt;return;}
  p.shootT-=dt;p.punchT-=dt;p.swingT=Math.max(0,p.swingT-dt);if(p.cool>0)p.cool-=dt;
  if(p.down>0){p.down-=dt;if(p.down<=0){p.down=0;p.ko=false;if(!p.cop){if(p.brave){p.hostile=true;p.hostT=8;}else{p.state='flee';p.fx=player.x;p.fy=player.y;p.t=5;}}}resolveCircleTiles(p,4);return;}
  let mx=0,my=0,spd=0;
  if(p.cop&&stars>0&&player.active){const tg=player.inCar||player,dx=tg.x-p.x,dy=tg.y-p.y,d=Math.hypot(dx,dy)||1;
    p.a=Math.atan2(dy,dx);if(d>(player.inCar?tg.L/2+9:11)){mx=dx/d;my=dy/d;spd=stars>=3?100:88;}
    if(stars>=2&&d<240&&p.shootT<=0&&los(p.x,p.y,tg.x,tg.y)){p.shootT=Math.max(.35,rr(.8,1.4)-stars*.1);const a=p.a+(R()-.5)*.16;
      bullets.push({x:p.x+Math.cos(a)*8,y:p.y+Math.sin(a)*8,vx:Math.cos(a)*600,vy:Math.sin(a)*600,life:.6,dmg:7,owner:'cop',ignore:null});
      addP(p.x+Math.cos(a)*9,p.y+Math.sin(a)*9,0,0,.05,4,'#fff6a0',true);sfx('shot',p.x,p.y);}
    if(!player.inCar&&d<13){p.bust+=dt;if(p.bust>1.1)busted();}
    else if(player.inCar&&Math.hypot(tg.vx,tg.vy)<20&&carDist(tg,p.x,p.y)<10){p.bust+=dt;if(p.bust>1.4)busted();}
    else p.bust=Math.max(0,p.bust-dt);}
  else if(p.hostile&&player.active){const tg=player.inCar||player,dx=tg.x-p.x,dy=tg.y-p.y,d=Math.hypot(dx,dy)||1;p.a=Math.atan2(dy,dx);
    if(p.gun){if(d>110){mx=dx/d;my=dy/d;spd=80;}
      if(d<250&&p.shootT<=0&&los(p.x,p.y,tg.x,tg.y)){p.shootT=rr(.7,1.3);const a=p.a+(R()-.5)*.22;
        bullets.push({x:p.x+Math.cos(a)*8,y:p.y+Math.sin(a)*8,vx:Math.cos(a)*600,vy:Math.sin(a)*600,life:.6,dmg:6,owner:'thug',ignore:null});addP(p.x+Math.cos(a)*9,p.y+Math.sin(a)*9,0,0,.05,4,'#fff6a0',true);sfx('shot',p.x,p.y);}}
    else{if(d>10){mx=dx/d;my=dy/d;spd=88;}if(d<14&&p.punchT<=0&&!player.inCar){p.punchT=.8;p.swingT=.18;hurtPlayer(5);sfx('punch',p.x,p.y);}}
    if(!p.keep){p.hostT-=dt;if(p.hostT<=0||d>500){p.hostile=false;p.state='flee';p.fx=tg.x;p.fy=tg.y;p.t=4;}}}
  else if(p.state==='flee'){p.t-=dt;const dx=p.x-p.fx,dy=p.y-p.fy,d=Math.hypot(dx,dy)||1;mx=dx/d+Math.sin(gtime*3+p.walk)*.3;my=dy/d+Math.cos(gtime*2.6+p.walk)*.3;spd=95;if(p.t<=0)p.state='wander';
    const l=Math.hypot(mx,my)||1;mx/=l;my/=l;p.a=Math.atan2(my,mx);}
  else if(p.kind==='hooker'||p.kind==='thug'||p.kind==='target'){p.sway=(p.sway||0)+dt*2;}
  else{p.t-=dt;if(p.t<=0){p.t=rr(2,6);p.dir=ri(0,3);p.idle=R()<.15;}
    const nt=tileW(p.x+DX[p.dir]*10,p.y+DY[p.dir]*10),cur=tileW(p.x,p.y);
    if(!(walkable(nt)||(cur===ROAD&&!solid(nt))))p.dir=(p.dir+ri(1,3))%4;else if(!p.idle){mx=DX[p.dir];my=DY[p.dir];spd=p.spd;}
    if(spd>0){const ta=Math.atan2(my,mx);p.a+=angDiff(ta,p.a)*Math.min(1,dt*10);}}
  if(spd>0){p.x+=mx*spd*dt;p.y+=my*spd*dt;p.walk+=dt*spd*.2;}
  resolveCircleTiles(p,4);}

// ---------- player ----------
function inputDir(){const L=phone.open||menu;return{up:!L&&(keys.KeyW||keys.ArrowUp),dn:!L&&(keys.KeyS||keys.ArrowDown),lf:!L&&(keys.KeyA||keys.ArrowLeft),rt:!L&&(keys.KeyD||keys.ArrowRight),L};}
function moveOnFoot(dt,collide){const p=player,k=inputDir();let mx=(k.rt?1:0)-(k.lf?1:0),my=(k.dn?1:0)-(k.up?1:0);const l=Math.hypot(mx,my);if(l>0){mx/=l;my/=l;}
  const sprint=(keys.ShiftLeft||keys.ShiftRight)&&l>0&&(p.stam>2||buffs.stam>0);const spd=sprint?150+8*stats.stam:100;
  if(sprint&&buffs.stam<=0)p.stam=Math.max(0,p.stam-28*dt);else if(!sprint)p.stam=Math.min(stamMax(),p.stam+(16+3*stats.stam)*dt);
  p.x+=mx*spd*dt;p.y+=my*spd*dt;p.vx=mx*spd;p.vy=my*spd;collide();if(l>0)p.walk+=dt*(sprint?28:20);
  return{l,mx,my,k};}
function updatePlayer(dt){const p=player;p.shootT-=dt;p.hurtT=Math.max(0,p.hurtT-dt);p.swingT=Math.max(0,p.swingT-dt);updateBuffs(dt);
  const mw=mouseWorld(),useM=gtime-mouse.last<3,L=phone.open||menu;
  if(p.inCar){const c=p.inCar,k=inputDir();c.th=(k.up?1:0)-(k.dn?1:0);c.st=(k.rt?1:0)-(k.lf?1:0);c.hb=!L&&!!keys.Space;p.x=c.x;p.y=c.y;p.vx=c.vx;p.vy=c.vy;
    if(!L&&mouse.down&&p.shootT<=0&&!WEAPONS[p.wp].melee){const a=Math.atan2(mw.y-c.y,mw.x-c.x);shootPlayer(c.x+Math.cos(a)*(c.W/2+4),c.y+Math.sin(a)*(c.W/2+4),a,c);}}
  else{const m=moveOnFoot(dt,()=>{resolveCircleTiles(p,4.5);pushOutOfCars(p,4.5);resolveCircleTiles(p,4.5);p.x=clamp(p.x,8,WORLD-8);p.y=clamp(p.y,8,WORLD-8);});
    if(useM)p.a=Math.atan2(mw.y-p.y,mw.x-p.x);else if(m.l>0)p.a=Math.atan2(m.my,m.mx);
    if(!L&&(mouse.down||keys.Space)&&p.shootT<=0)shootPlayer(p.x+Math.cos(p.a)*9,p.y+Math.sin(p.a)*9,p.a,null);
    for(const o of peds){if(o.dead)continue;const dx=o.x-p.x,dy=o.y-p.y,d=Math.hypot(dx,dy);if(d<9&&d>0){o.x=p.x+dx/d*9;o.y=p.y+dy/d*9;}}}
  for(let i=pickups.length-1;i>=0;i--){const k=pickups[i];if(Math.hypot(k.x-p.x,k.y-p.y)>(p.inCar?22:15))continue;let took=true;
    if(k.type==='cash'){addMoney(k.val);}
    else if(k.type==='health'){if(p.hp>=hpMax())took=false;else{heal(40);msg('HEALTH','#f77',1.2);}}
    else if(k.type==='smg'){p.ammo[4]+=90;if(p.wp<3)p.wp=4;msg('S-UZI +90','#ff8',1.4);}
    else if(k.type==='shotgun'){p.ammo[5]+=16;if(p.wp<3)p.wp=5;msg('SHOTGUN +16','#ff8',1.4);}
    else if(k.type==='pistol'){p.ammo[3]+=24;msg('PISTOL AMMO +24','#ff8',1.4);}
    if(took){pickups.splice(i,1);sfx('pick');}}
  computePrompts();if(p.hp<=0)wasted();}
function computePrompts(){prompts.E=null;prompts.R=null;const p=player;if(!p.active||state!=='play'||fade)return;
  const cand=(key,d,label,act)=>{if(!prompts[key]||d<prompts[key].d)prompts[key]={d,label,act};};
  if(interior){for(const s of interior.spots){if(s.cond&&!s.cond())continue;const d=Math.hypot(p.x-s.x,p.y-s.y);if(d<s.r)cand(s.key,d,typeof s.label==='function'?s.label():s.label,s.act);}interiorPrompt3(cand);return;}
  if(!p.inCar){let best=null,bd=14;for(const c of cars){if(c.wreck)continue;const d=carDist(c,p.x,p.y);if(d<bd){bd=d;best=c;}}
    if(best)cand('E',bd+3,best.driver==='ai'||best.driver==='cop'?'Jack this '+CAR_TYPES[best.type].name.toLowerCase():'Get in the '+CAR_TYPES[best.type].name.toLowerCase(),tryEnter);
    for(const o of pois){const d=Math.hypot(p.x-o.spot.x,p.y-o.spot.y);if(d>20)continue;
      if(o.type==='garage'||o.type==='chop')cand('E',d,o.name+' - drive a car into the bay',()=>msg('BRING A CAR INTO THE BAY','#fa0'));else if(!poiPrompt3(o,d,cand))cand('E',d,'Enter '+o.name,()=>enterInterior(o));}
    for(const a of atms){const d=Math.hypot(p.x-a.x,p.y-a.y);if(d<18)cand('E',d,'Use ATM',()=>openBank('ATM'));}
    for(const h of peds){if(h.dead)continue;const d=Math.hypot(p.x-h.x,p.y-h.y);if(d>18)continue;
      if(h.kind==='hooker'&&!h.hostile&&h.state!=='flee'&&!(h.cool>0))cand('E',d+1,'Hire her ($'+HOOKER_FEE+')',()=>hireHooker(h));
      if(!h.cop&&!h.mugged&&!h.hostile&&h.kind!=='thug'&&h.kind!=='target')cand('R',d,h.down>0?'Take their wallet':'Mug'+(p.wp>=1?' (armed)':' (unarmed - risky)'),()=>mugPed(h));}}
  else{const c=p.inCar,sp=Math.hypot(c.vx,c.vy);carPrompt3(c,sp,cand);
    for(const o of pois){if(o.type!=='garage'&&o.type!=='chop')continue;const d=Math.hypot(c.x-o.spot.x,c.y-o.spot.y);if(d<38&&sp<80)cand('E',d,'Drive into '+o.name,()=>openGarage(o));}
    for(const h of peds){if(h.kind!=='hooker'||h.dead||h.state==='flee'||h.cool>0)continue;const d=Math.hypot(c.x-h.x,c.y-h.y);if(d<36&&sp<45)cand('E',d,'Pick her up ($'+HOOKER_FEE+')',()=>hireHooker(h));}}}
function tryEnter(){let best=null,bd=14;for(const c of cars){if(c.wreck)continue;const d=carDist(c,player.x,player.y);if(d<bd){bd=d;best=c;}}if(!best)return;
  const c=best,drv=c.driver;cameraCheck(c);
  if(drv==='ai'||drv==='cop'){ejectDriver(c);addHeat(drv==='cop'?90:22);msg(drv==='cop'?'COP CAR JACKED!':'CAR JACKED!','#ff8');}
  else if(c.type==='police')addHeat(40);
  if(!c.everPlayer){c.everPlayer=true;c.stolen=true;career.cars++;gainXP(3);}
  c.driver='player';c.ai=null;player.inCar=c;sfx('door');msg(CAR_TYPES[c.type].name,'#9cf',1.5);}

function carPrice(c){const u=c.up;return Math.round(CAR_VALUE[c.type]*(.3+.7*c.hp/c.maxHp)*(c.flat?.85:1)+(u.eng*300+u.brk*150+u.arm*350+u.tire*200+u.nitro*400+u.bpt*250+u.ram*300)*.4);}
function upgItem(c,name,key,max,prices,reqs,desc){const lv=c.up[key];if(lv>=max)return{label:name+' (MAXED)',dis:true,why:'ALREADY MAXED',right:'MAX'};
  const req=reqs[lv]||1;return{label:name+(max>1?' LV'+(lv+1):''),price:prices[lv],req,note:desc,dis:level()<req,why:'REQUIRES REP LEVEL '+req,act:buy(prices[lv],()=>{c.up[key]++;applyUpgrades(c);msg(name+' INSTALLED','#8cf');},req)};}
function openGarage(o){const c=player.inCar;if(!c)return;const f=()=>{const it=[],pct=Math.round(100*c.hp/c.maxHp);
  if(o.type==='garage'){const cost=Math.ceil((1-c.hp/c.maxHp)*260)+(c.flat?60:0)+(c.fire>0?100:0);
    it.push({label:'Repair'+(c.flat?' + new tire':'')+(c.fire>0?' + extinguish':''),price:cost>0?cost+20:0,dis:cost<=0,why:'CAR IS IN PERFECT SHAPE',act:buy(cost+20,()=>{c.hp=c.maxHp;c.flat=false;c.fire=0;msg('GOOD AS NEW','#8f8');})});

    it.push(upgItem(c,'BRAKES','brk',2,[300,700],[1,2],'Stop on a dime'));

  it.push({label:'Drive out',act:closeMenu});

  c.vx=c.vy=0;f();}
function exitCarAt(o){const c=player.inCar;player.inCar=null;c.driver=null;player.x=o.spot.x+o.n[0]*14+o.n[1]*20;player.y=o.spot.y+o.n[1]*14+o.n[0]*20;}

function enterInterior(o){startFade('',()=>{interior=buildRoom(o);interior.ret={x:o.spot.x,y:o.spot.y};player.x=interior.door.x;player.y=interior.door.y-22;player.a=-PI/2;bullets.length=0;

function exitInterior(){const r=interior;if(!r)return;startFade('',()=>{if(r.rob)finishRobbery(r,true);if(r.type==='house')leaveHouse(r);player.x=r.ret.x;player.y=r.ret.y;cam.x=player.x;cam.y=player.y;interior=null;},.15);}
function startRobbery(r){const o=r.poi,big=o.type==='bank';
  if(r.clerkDead&&!big){const v=ri(150,450);addMoney(v);o.empty=gtime+300;career.robs++;gainXP(20);msg('LOOTED $'+v,'#7f7');return;}
  if(player.wp===0||(big&&player.wp<3)){msg(big?'YOU NEED A GUN TO ROB A BANK':'BRANDISH A WEAPON FIRST (Q / 1-7)','#f88');return;}
  const tot={grocery:[150,400],gas:[200,500],clothing:[300,650],gun:[500,1000],pawn:[400,900],bank:[2500,6000]}[o.type]||[100,300];
  r.rob={t:0,dur:big?9:5,total:ri(tot[0],tot[1]),got:0};msg(big?'"EVERYBODY ON THE FLOOR!"':'"EMPTY THE REGISTER!"','#ff8',2);sfx('alarm');
  for(const n of r.npcs)if(n.role==='clerk'||n.role==='teller')n.handsUp=true;
  if(big){r.alarmed=true;addHeat(200);if(r.guard&&!r.guard.dead){r.guard.hostile=true;}msg('THE ALARM IS RINGING!','#f44',2.5);}
  else{if(o.type==='gun'||(r.clerk.brave&&R()<.6)){r.resistT=.9;}if(R()<.4){r.alarmed=true;addHeat(60);msg('SILENT ALARM TRIGGERED!','#f66',2);}}}
function finishRobbery(r,aborted){const o=r.poi,big=o.type==='bank',v=Math.floor(r.rob.got);r.rob=null;for(const n of r.npcs)n.handsUp=false;
  if(v<=0)return;addMoney(v);o.empty=gtime+300;career.robs++;gainXP((big?150:35)*(aborted?.5:1));addHeat(big?450:90);msg((aborted?'GOT AWAY WITH $':'ROBBERY COMPLETE  +$')+v,'#7f7',2.5);saveT=1;}
function roomCollide(r){const p=player;p.x=clamp(p.x,6,r.w-6);p.y=clamp(p.y,6,r.h-6);
  for(const q of r.props){if(!q.solid)continue;const cx=clamp(p.x,q.x,q.x+q.w),cy=clamp(p.y,q.y,q.y+q.h),dx=p.x-cx,dy=p.y-cy,d=Math.hypot(dx,dy);
    if(d<5){if(d>0.01){p.x=cx+dx/d*5;p.y=cy+dy/d*5;}else p.y=q.y+q.h+5;}}}
function interiorMouse(){const r=interior;if(!r||!r._sc)return{x:player.x,y:player.y-10};return{x:(mouse.x/PIX-r._ox)/r._sc,y:(mouse.y/PIX-r._oy)/r._sc};}
function interiorAttack(){const r=interior,p=player,w=WEAPONS[p.wp];p.shootT=w.rate;
  if(!w.melee){if(p.ammo[p.wp]<=0){autoWeapon();return;}p.ammo[p.wp]--;sfx(w.snd);}else{p.swingT=.18;sfx('swing');}
  let best=null,bd=1e9;for(const n of r.npcs){if(n.dead||n.role==='dancer'||n.role==='patron'||n.role==='hostess'||n.role==='escort')continue;
    const dx=n.x-p.x,dy=n.y-p.y,d=Math.hypot(dx,dy),ad=Math.abs(angDiff(Math.atan2(dy,dx),p.a));if(w.melee?(d<w.range+8&&ad<1.1):(ad<.3&&d<420))if(d<bd){bd=d;best=n;}}
  if(!w.melee)r.tracers.push({x1:p.x+Math.cos(p.a)*8,y1:p.y+Math.sin(p.a)*8,x2:best?best.x:p.x+Math.cos(p.a)*420,y2:best?best.y:p.y+Math.sin(p.a)*420,t:.06});
  if(best){best.hp-=(w.melee?w.dmg*(1+.2*stats.melee):w.dmg*(w.pellets>1?3:1))*dmgMul();for(let i=0;i<5;i++)r.fx.push({x:best.x,y:best.y,vx:rr(-40,40),vy:rr(-40,40),t:.35,c:'#b01010'});
    if(best.hp<=0){best.dead=true;best.hostile=false;sfx('splat');addHeat(best.role==='guard'?70:45);career.kills++;if(best===r.clerk||best.role==='teller')r.clerkDead=best===r.clerk;}
    else if(best.role==='guard'||best.role==='bouncer'||best===r.clerk&&best.brave)best.hostile=true;}
  if(!w.melee)r.noise=100;
  if(!w.melee&&!r.alarmed){r.alarmed=true;addHeat(30);for(const n of r.npcs)if(n.role==='guard'||n.role==='bouncer')n.hostile=true;}}
function updateInterior(dt){const r=interior,p=player;p.shootT-=dt;p.hurtT=Math.max(0,p.hurtT-dt);p.swingT=Math.max(0,p.swingT-dt);updateBuffs(dt);
  const m=moveOnFoot(dt,()=>roomCollide(r));const L=phone.open||menu;
  if(gtime-mouse.last<3){const mw=interiorMouse();p.a=Math.atan2(mw.y-p.y,mw.x-p.x);}else if(m.l>0)p.a=Math.atan2(m.my,m.mx);
  if(!L&&(mouse.down||keys.Space)&&p.shootT<=0)interiorAttack();
  for(const n of r.npcs){if(n.dead)continue;if(npc3(n,r,dt))continue;
    if(n.role==='dancer'){n.ph+=dt*.9;n.x=200+Math.cos(n.ph)*20;n.y=78+Math.sin(n.ph)*14;n.walk+=dt*6;continue;}
    if(n.role==='patron'){n.walk+=dt*.5;continue;}
    if(n.hostile){n.a=Math.atan2(p.y-n.y,p.x-n.x);n.gun=true;n.handsUp=false;n.shootT-=dt;if(n.shootT<=0){n.shootT=rr(.8,1.3);sfx('shot');
      const hit=R()<.65;r.tracers.push({x1:n.x,y1:n.y,x2:p.x+(hit?0:rr(-20,20)),y2:p.y+(hit?0:rr(-20,20)),t:.06});if(hit)hurtPlayer(n.role==='guard'?9:7);}}}
  if(r.resistT>0){r.resistT-=dt;if(r.resistT<=0&&!r.clerk.dead){r.clerk.hostile=true;msg('THE CLERK PULLED A SHOTGUN!','#f66',2);}}
  if(r.rob){const d=Math.hypot(p.x-r.clerk.x,p.y-(r.clerk.y+40));if(d>90){msg('ROBBERY ABORTED','#fa0');finishRobbery(r,true);}
    else{r.rob.t+=dt;r.rob.got=Math.min(r.rob.total,r.rob.got+r.rob.total*dt/r.rob.dur);if(r.rob.t>=r.rob.dur)finishRobbery(r,false);}}
  for(let i=r.fx.length-1;i>=0;i--){const f=r.fx[i];f.t-=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;if(f.t<=0)r.fx.splice(i,1);}
  for(let i=r.tracers.length-1;i>=0;i--){r.tracers[i].t-=dt;if(r.tracers[i].t<=0)r.tracers.splice(i,1);}
  for(let i=msgs.length-1;i>=0;i--){msgs[i].t-=dt;if(msgs[i].t<=0)msgs.splice(i,1);}
  computePrompts();if(p.hp<=0)wasted();}

// ---------- missions ----------
function randSidewalk(cx,cy,r0,r1){for(let i=0;i<60;i++){const a=R()*TAU,d=rr(r0,r1),x=cx+Math.cos(a)*d,y=cy+Math.sin(a)*d,tx=Math.floor(x/T),ty=Math.floor(y/T);
  if(tx<2||ty<2||tx>=N-2||ty>=N-2)continue;if(tileAt(tx,ty)===SIDE)return{x:(tx+.5)*T,y:(ty+.5)*T};}return{x:player.x,y:player.y};}
const HIT_NAMES=['FAT TONY','SLICK RICK','JOHNNY TWO-TIMES','THE ACCOUNTANT','MAD MAXINE','LEFTY LOU'];
function genOffer(type){const C=CONTACTS.find(c=>c.type===type);
  if(type==='delivery')return{type,contact:C.name,title:'Hot Bread',desc:'Pick up a package and get it across town before the timer runs out.',reward:ri(30,60)*10,xp:80};
  if(type==='steal'){const ct=pick(['sport','van','sedan','sport']),col=pick([['RED','#c02020'],['BLUE','#2050c0'],['GREEN','#20a040'],['BLACK','#181818'],['WHITE','#e8e8e8']]);
    return{type,contact:C.name,title:'Boost a '+col[0].toLowerCase()+' '+CAR_TYPES[ct].name.toLowerCase(),desc:'A client wants a '+col[0].toLowerCase()+' '+CAR_TYPES[ct].name.toLowerCase()+'. Steal the marked one and drive it into a chop shop bay. Pay drops if it is damaged.',car:ct,col:col[1],reward:ri(50,90)*10,xp:110};}
  if(type==='hit'){const nm=pick(HIT_NAMES);return{type,contact:C.name,title:'Take out '+nm,desc:nm+' is on the street with two armed bodyguards. Make it permanent.',name:nm,reward:ri(80,130)*10,xp:150};}
  return{type,contact:C.name,title:'Heat Wave',desc:'You start with 3 stars. Shake the cops within 90 seconds.',reward:ri(45,70)*10,xp:120};}
function refreshOffers(){offers=CONTACTS.map(c=>genOffer(c.type));}
function startMission(o){if(mission){msg('FINISH YOUR CURRENT JOB FIRST','#f88');return;}phone.open=false;const m=Object.assign({},o,{stage:0,t:0,timer:0,target:null,obj:''});
  if(o.type==='delivery'){m.a=randSidewalk(player.x,player.y,350,800);m.target=m.a;m.obj='Pick up the package';}
  else if(o.type==='steal'){let slot=null;const sl=lotSlots.filter(s=>{const d=Math.hypot(s.x-player.x,s.y-player.y);return d>500&&d<1500;});
    slot=sl.length?pick(sl):(()=>{const q=randSidewalk(player.x,player.y,600,1200);return{x:q.x,y:q.y,a:0};})();
    cars=cars.filter(c=>c===player.inCar||Math.hypot(c.x-slot.x,c.y-slot.y)>30);
    const c=makeCar(o.car,slot.x,slot.y,slot.a);c.color=o.col;c.roof=shade(o.col,1.15);c.dark=shade(o.col,.7);c.keep=true;c.missionCar=true;cars.push(c);m.car=c;m.obj='Steal the marked car';m.target=c;}
  else if(o.type==='hit'){const q=randSidewalk(player.x,player.y,700,1300);const t=makePed(q.x,q.y,false);Object.assign(t,{kind:'target',shirt:'#f0f0f0',pants:'#e0e0e0',hair:'#222',gun:true,hp:90,keep:true,cash:400,brave:true});
    peds.push(t);m.ped=t;m.thugs=[];for(let i=0;i<2;i++){const th=makePed(q.x+rr(-18,18),q.y+rr(-18,18),false);Object.assign(th,{kind:'thug',shirt:'#1a1a1a',pants:'#101010',hair:'#000',gun:true,hp:60,keep:true,cash:ri(30,80)});peds.push(th);m.thugs.push(th);}
    m.target=t;m.obj='Kill '+o.name;}
  else{heat=Math.max(heat,STAR[3]+40);lastSeen=0;m.timer=90;m.obj='Lose the cops!';}
  mission=m;msg('JOB: '+o.title.toUpperCase(),'#ffd23a',2.5);sfx('phone');}
function cleanupMission(){const m=mission;if(!m)return;if(m.car){m.car.missionCar=false;}if(m.ped){m.ped.keep=false;}if(m.thugs)for(const t of m.thugs)t.keep=false;
  const i=CONTACTS.findIndex(c=>c.type===m.type);if(i>=0)offers[i]=genOffer(m.type);mission=null;}
function completeMission(bonus){const m=mission;const v=Math.round(m.reward*(bonus||1));addMoney(v);gainXP(m.xp);career.missions++;msg('JOB COMPLETE!  +$'+v,'#7f7',3.5);sfx('level');cleanupMission();saveT=1;}
function failMission(why){msg('JOB FAILED: '+why,'#f55',3.5);cleanupMission();}
function deliverMissionCar(o){const c=player.inCar,b=.5+.5*c.hp/c.maxHp;startFade("VINNIE'S BOYS TAKE THE CAR...",()=>{exitCarAt(o);const i=cars.indexOf(c);if(i>=0)cars.splice(i,1);completeMission(b);},1);}
function updateMission(dt){const m=mission;if(!m||state!=='play')return;const p=player,tg=p.inCar||p,dd=q=>Math.hypot(tg.x-q.x,tg.y-q.y);m.t+=dt;
  if(m.type==='delivery'){if(m.stage===0){if(dd(m.a)<30){m.stage=1;m.b=randSidewalk(m.a.x,m.a.y,900,1700);m.timer=Math.round(Math.hypot(m.b.x-m.a.x,m.b.y-m.a.y)/115+25);m.target=m.b;m.obj='Deliver the package!';msg('GOT THE PACKAGE - GO!','#ffd23a');sfx('pick');}}
    else{m.timer-=dt;if(m.timer<=0)return failMission('TOO SLOW');if(dd(m.b)<30)completeMission();}}
  else if(m.type==='steal'){const c=m.car;if(!c||c.wreck||!cars.includes(c))return failMission('THE CAR WAS WRECKED');
    if(p.inCar===c){const o=nearestPOI('chop',c.x,c.y);m.stage=1;m.target=o.spot;m.obj='Drive it into '+o.name+' (E in the bay)';}else{m.stage=0;m.target=c;m.obj='Steal the marked car';}}
  else if(m.type==='hit'){const t=m.ped;if(m.killed||t.dead){addHeat(80);return completeMission();}
    if(dd(t)<230||t.hp<90){for(const q of[t,...m.thugs])if(!q.dead)q.hostile=true;}}
  else if(m.type==='escape'){m.timer-=dt;if(stars===0&&m.t>1)return completeMission();if(m.timer<=0)failMission('THE COPS STILL HAVE YOU');}}
function gpsTarget(){if(mission&&mission.target)return{x:mission.target.x,y:mission.target.y,label:mission.obj,mission:true};
  if(gps){let t=null;if(gps.type==='atm')t=nearestATM(focus.x,focus.y);else if(gps.type==='redlight')t={x:redZone.cx,y:redZone.cy};else{const o=nearestPOI(gps.type,focus.x,focus.y);t=o&&o.spot;}
    if(t)return{x:t.x,y:t.y,label:gps.label};}return null;}

const APPS=[{id:'gps',name:'GPS',col:'#2f8cff',g:'\u27a4'},{id:'missions',name:'JOBS',col:'#ff9a20',g:'!'},{id:'bank',name:'BANK',col:'#27b85a',g:'$'},
  {id:'stats',name:'REP',col:'#b050ff',g:'\u2605'},{id:'contacts',name:'CONTACTS',col:'#ff5070',g:'\u260e'},{id:'system',name:'SYSTEM',col:'#8a8a8a',g:'\u2699'}];

function phoneView(){const a=phone.app,v={title:(APPS.find(x=>x.id===a)||{}).name||'',lines:[],items:[],foot:[]};
  if(a==='gps'){v.items.push({label:'Clear route',act:()=>{gps=null;msg('GPS CLEARED','#9cf',1);}});
    for(const [t,l] of GPS_DEST){let q=null;if(t==='atm')q=nearestATM(focus.x,focus.y);else if(t==='redlight')q={x:redZone.cx,y:redZone.cy};else{const o=nearestPOI(t,focus.x,focus.y);q=o&&o.spot;}
      v.items.push({label:l,right:q?Math.round(Math.hypot(q.x-focus.x,q.y-focus.y)/8)+'m':'-',act:()=>{gps={type:t,label:l};phone.open=false;msg('GPS: '+l.toUpperCase(),'#9cf',1.5);}});}

      v.items.push({label:'Abandon job',act:()=>{failMission('ABANDONED');}});}
    else{const o=offers[phone.sel];if(o)v.lines.push(o.desc);for(const o of offers)v.items.push({label:o.title,right:'$'+o.reward,sub:o.contact,act:()=>startMission(o)});v.foot.push('ENTER: accept job');}}

    v.items.push({label:'Find nearest ATM',act:()=>{gps={type:'atm',label:'ATM'};phone.open=false;}});v.foot.push('Deposit/withdraw at an ATM or bank.','Wallet cash is lost when WASTED.');}
  else if(a==='stats'){const L=level(),x0=xpFor(L),x1=xpFor(L+1);v.lines.push('REP LEVEL '+L+'   XP '+(xp-x0)+'/'+(x1-x0),'SKILL POINTS: '+skillPts);v.xpbar=(xp-x0)/(x1-x0);
    for(const s of STAT_DEF){const lv=stats[s.k];v.items.push({label:s.name,right:'\u25a0'.repeat(lv)+'\u25a1'.repeat(5-lv),sub:s.desc,act:()=>{if(skillPts<=0){msg('NO SKILL POINTS - EARN REP','#f88',1.4);return;}if(lv>=5){msg('MAXED','#f88',1);return;}stats[s.k]++;skillPts--;if(s.k==='hp')player.hp+=15;sfx('level');saveT=1;}});}
    v.foot.push('Kills '+career.kills+'  Cops '+career.cops+'  Cars '+career.cars,'Robberies '+career.robs+'  Muggings '+career.mugs+'  Jobs '+career.missions,'Unlocks: LV2 uzi, armor, nitro','LV3 shotgun, ram  LV4 heavy armor','LV5 rifle');}
  else if(a==='contacts'){const c=CONTACTS[phone.sel];if(c)v.lines.push(c.bio);for(const c of CONTACTS)v.items.push({label:c.name,right:'',sub:c.role,act:()=>{phone.app='missions';phone.sel=CONTACTS.indexOf(c);}});}

    {label:'Delete save + new game',act:()=>{try{localStorage.removeItem(SAVE_KEY);}catch(e){}startGame(true);}},{label:'Pixels: '+(HIRES?'HI-RES':'RETRO'),act:()=>{HIRES=!HIRES;try{localStorage.setItem('pta_lores',HIRES?'0':'1');}catch(e){}resize();}},{label:'Display & text size  \u203a',right:'',act:()=>{phone.app='display';phone.sel=0;}},...touchSysItems(),{label:'Close phone',act:()=>{phone.open=false;}});v.foot.push('Autosaves every 30s and after big events.');}

function phoneKey(code){const up=code==='ArrowUp'||code==='KeyW',dn=code==='ArrowDown'||code==='KeyS',lf=code==='ArrowLeft'||code==='KeyA',rt=code==='ArrowRight'||code==='KeyD',ok=code==='Enter'||code==='KeyE'||code==='Space',back=code==='Escape'||code==='Backspace';
  if(code==='KeyC'||code==='KeyI'){phone.open=false;return;}
  if(phone.app==='home'){const na=APPS.length;if(lf)phone.sel=(phone.sel+na-1)%na;if(rt)phone.sel=(phone.sel+1)%na;const pc=phone.cols||2;if(up)phone.sel=(phone.sel+na-pc)%na;if(dn)phone.sel=(phone.sel+pc)%na;
    if(ok){phone.app=APPS[phone.sel].id;phone.sel=0;sfx('phone');}if(back)phone.open=false;return;}
  const v=phoneView(),n=v.items.length;if((lf||rt)&&v.items[phone.sel]&&v.items[phone.sel].adj){v.items[phone.sel].adj(rt?1:-1);sfx('phone');return;}if(back&&phone.app==='display'){phone.app='system';phone.sel=0;return;}if(up&&n)phone.sel=(phone.sel-1+n)%n;if(dn&&n)phone.sel=(phone.sel+1)%n;
  if(ok&&v.items[phone.sel]){v.items[phone.sel].act();sfx('phone');}
  if(back){phone.sel=APPS.findIndex(x=>x.id===phone.app);phone.app='home';}}
function openPhone(app){phone.open=true;phone.app=app||'home';phone.sel=0;sfx('phone');}

function saveGame(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({v:2,money:player.money,bank,xp,skillPts,stats,career,ammo:player.ammo.map(a=>a===Infinity?-1:a),owned:player.owned||[],armor:Math.round(player.armor),
  outfit:{shirt:player.shirt,pants:player.pants,hat:player.hat},banklog}));}catch(e){}}
function loadGame(){try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(!s)return false;player.money=s.money|0;bank=s.bank|0;xp=s.xp|0;skillPts=s.skillPts|0;Object.assign(stats,s.stats||{});Object.assign(career,s.career||{});

// ---------- car physics (upgrades, skill, nitro, flats) ----------
function carPhysics(c,dt){const th=c.th,hb=c.hb,u=c.up||{},isP=c===player.inCar;let st=c.st;
  const skill=isP?1+.06*stats.drive:1,tg=(1+.15*(u.tire||0))*skill*(c.flat?.6:1);
  if(c.flat&&c.driver)st+=.12*Math.sin(gtime*7)*.5+.08;
  let boost=false;if(isP&&u.nitro&&c.nos>0&&(keys.ShiftLeft||keys.ShiftRight)&&th>0&&!c.wreck){boost=true;c.nos=Math.max(0,c.nos-dt*.33);if(R()<.7)addP(c.x-Math.cos(c.a)*c.L/2,c.y-Math.sin(c.a)*c.L/2,-c.vx*.2+rr(-20,20),-c.vy*.2+rr(-20,20),.25,3,pick(['#6cf','#fff','#39f']),false);}
  else if(c.nos<1)c.nos=Math.min(1,c.nos+dt*.05);c.boost=boost;
  const mx=c.max*(boost?1.35:1)*(c.flat?.8:1),acc=c.acc*(boost?2.1:1);
  let fx=Math.cos(c.a),fy=Math.sin(c.a);let vf=c.vx*fx+c.vy*fy;
  const sf=Math.min(1,Math.abs(vf)/50),tr=(2.9-1.1*Math.min(1,Math.abs(vf)/mx))*(hb?1.45:1)*(isP?1+.04*stats.drive:1);
  c.a+=st*tr*sf*(vf>=0?1:-1)*dt+c.av*dt;c.av*=Math.exp(-4*dt);
  fx=Math.cos(c.a);fy=Math.sin(c.a);vf=c.vx*fx+c.vy*fy;let vr=-c.vx*fy+c.vy*fx;
  if(th>0){if(vf<-5)vf+=c.brake*dt;else vf+=acc*th*dt*(1-Math.max(0,vf)/mx*.5);}
  else if(th<0){if(vf>5)vf-=c.brake*dt*-th;else vf-=c.acc*.6*dt;}
  else{vf-=vf*1.1*dt;if(Math.abs(vf)<10)vf*=Math.exp(-6*dt);}
  if(!c.driver||c.wreck){vf*=Math.exp(-(c.wreck?3:1.4)*dt);}
  vf-=vf*.22*dt;vf=clamp(vf,-mx*.45,mx);
  const grip=hb?1.1*tg:(8.5-3.5*Math.min(1,Math.abs(vf)/mx))*tg;vr*=Math.exp(-grip*dt);if(hb)vf*=Math.exp(-.8*dt);
  c.vx=fx*vf-fy*vr;c.vy=fy*vf+fx*vr;c.vf=vf;c.vr=vr;c.x+=c.vx*dt;c.y+=c.vy*dt;
  c.braking=th<0&&vf>5;c.skid=!c.wreck&&(Math.abs(vr)>55||(hb&&Math.abs(vf)>70));}

// resident AI (returns true if handled)
function npc3(n,r,dt){if(n.role!=='resident')return false;const p=player,d=Math.hypot(p.x-n.x,p.y-n.y);
  const wake=()=>{if(n.state!=='idle'&&n.state!=='tv')return;n.sleep=false;n.a=Math.atan2(p.y-n.y,p.x-n.x);
    if(n.brave){n.state='fight';n.hostile=true;msg(n.gunR?'"GET OUT OF MY HOUSE!" (THEY HAVE A GUN)':'"I\'LL KILL YOU!"','#f66',2);if(n.gunR)n.gun=true;}
    else{n.state='call';n.calling=4;msg('THE RESIDENT IS CALLING 911! STOP THEM ('+KL('rob')+')','#f66',2.5);}};
  if((n.state==='idle'||n.state==='tv')&&n.hp<(n.hp0||40)){wake();return true;}
  if(n.state==='idle'||n.state==='tv'){if(n.sleep){if(r.noise>45||(d<26&&R()<dt*.3))wake();}
    else{const ang=Math.abs(angDiff(Math.atan2(p.y-n.y,p.x-n.x),n.a));if(r.noise>25||(d<150&&(ang<1.3||d<40)))wake();}return true;}
  if(n.state==='fight'){n.a=Math.atan2(p.y-n.y,p.x-n.x);n.shootT-=dt;
    if(n.gunR){if(n.shootT<=0){n.shootT=rr(.9,1.4);sfx('shot');r.noise=100;const hit=R()<.55;r.tracers.push({x1:n.x,y1:n.y,x2:p.x+(hit?0:rr(-20,20)),y2:p.y+(hit?0:rr(-20,20)),t:.06});if(hit)hurtPlayer(7);}}
    else{if(d>11){n.x+=Math.cos(n.a)*70*dt;n.y+=Math.sin(n.a)*70*dt;n.walk=(n.walk||0)+dt*10;}else if(n.shootT<=0){n.shootT=.9;n.swingT=.18;sfx('punch');hurtPlayer(n.bat?9:5);}}
    n.swingT=Math.max(0,(n.swingT||0)-dt);return true;}
  if(n.state==='call'){const tx=282,ty=58;const dd=Math.hypot(tx-n.x,ty-n.y);if(dd>6){n.a=Math.atan2(ty-n.y,tx-n.x);n.x+=Math.cos(n.a)*55*dt;n.y+=Math.sin(n.a)*55*dt;n.walk=(n.walk||0)+dt*9;}
    n.calling-=dt;if(n.calling<=0){n.state='cower';n.calling=0;n.handsUp=true;const want=Math.max(2,stars);heat=Math.max(heat,STAR[want]+20);lastSeen=0;msg('THE COPS ARE ON THEIR WAY!','#f44',2.5);sfx('alarm');}
    return true;}
  if(n.state==='cower'){n.handsUp=true;n.a=Math.atan2(p.y-n.y,p.x-n.x);return true;}
  return true;}
function intimidate(n){n.state='cower';n.calling=0;n.handsUp=true;msg('"OKAY OKAY! TAKE WHATEVER YOU WANT!"','#ff8',2);gainXP(3);}
function updateHouse(r,dt){r.noise=Math.max(0,r.noise-dt*7);
  if(r.alarmT>0){r.alarmT-=dt;if(r.alarmT<=0){r.alarmT=-1;r.alarmRing=true;r.noise=100;heat=Math.max(heat,STAR[2]+30);lastSeen=0;msg('BURGLAR ALARM! COPS ARE COMING','#f44',3);sfx('alarm');}}
  if(r.alarmRing&&Math.floor(gtime*2)!==Math.floor((gtime-dt)*2))sfx('alarm');

function openClothing(o,ward){const title=ward?'WARDROBE':o.name,sub=()=>(ward?'Wear anything you own for free':'WALLET $'+player.money)+(stars>0?'   (a new look sheds 1 star)':'');

// GPS: breadth-first search over intersections (ignores one-way rules - the GPS line may point the wrong way down a one-way)
const NADJ=NODES.map(()=>[]);for(const k in vN){const l=vN[k];for(let i=0;i+1<l.length;i++){NADJ[l[i].id].push(l[i+1].id);NADJ[l[i+1].id].push(l[i].id);}}

  {id:'left',label:'Left / steer left',canon:'KeyA',def:['KeyA','ArrowLeft']},
  {id:'right',label:'Right / steer right',canon:'KeyD',def:['KeyD','ArrowRight']},
  {id:'attack',label:'Attack / handbrake',canon:'Space',def:['Space',null]},
  {id:'sprint',label:'Sprint / nitro',canon:'ShiftLeft',def:['ShiftLeft','ShiftRight']},
  {id:'interact',label:'Interact / car in-out',canon:'KeyE',def:['KeyE','KeyF']},

  {id:'bag',label:'Inventory (bag)',canon:'KeyI',def:['KeyI',null]},

  {id:'wprev',label:'Previous weapon',canon:'WeapPrev',def:['KeyZ',null]},

// load + validate (like the Display prefs: anything odd falls back to defaults, never throws)
function kbLoad(){let o=null;try{o=JSON.parse(localStorage.getItem(KB_KEY)||'null');}catch(e){o=null;}

// human names for codes
const KB_NAMES={Space:'SPACE',ShiftLeft:'SHIFT',ShiftRight:'R-SHIFT',ControlLeft:'CTRL',ControlRight:'R-CTRL',AltLeft:'ALT',AltRight:'R-ALT',Tab:'TAB',Enter:'ENTER',NumpadEnter:'NUM ENTER',
  Backspace:'BKSP',CapsLock:'CAPS',ArrowUp:'\u25b2',ArrowDown:'\u25bc',ArrowLeft:'\u25c0',ArrowRight:'\u25b6',Minus:'-',Equal:'=',BracketLeft:'[',BracketRight:']',Semicolon:';',Quote:"'",
  Comma:',',Period:'.',Slash:'/',Backslash:'\\',Backquote:'`',Insert:'INS',Delete:'DEL',Home:'HOME',End:'END',PageUp:'PGUP',PageDown:'PGDN',WeapPrev:'-'};

function kbAssign(id,slot,code){const a=KB_BY[id];if(!a)return false;

  return true;}
function kbClear(id,slot){const a=KB_BY[id];if(!a)return;if(slot===0&&a.must&&!KB.b[id][1]){KB.note='The phone always needs a key.';return;}KB.b[id][slot]=null;kbNorm(id);kbRebuild();kbSave();KB.note='Cleared.';}
function kbResetAction(id){const a=KB_BY[id];const nv=[null,null];

// ---------------- keyboard event translation ----------------
function kbUiCtx(){return state!=='play'||!!menu||!!phone.open||!!fade;}
function kbDown(e){const code=e.code;if(!code)return;
  if(KB.cap){e.preventDefault();if(e.repeat)return;if(code==='Escape')kbCancel();else if(kbAssign(KB.cap.id,KB.cap.slot,code))KB.cap=null;else KB.cap=null;KB.swallow[code]=1;KB.phys[code]=true;return;}

function kbUp(e){const code=e.code;if(!code)return;KB.phys[code]=false;if(KB.swallow[code]){delete KB.swallow[code];return;}
  for(const id of KB.map[code]||[]){const c=KB_BY[id].canon;keys[c]=KB.b[id].some(k=>k&&KB.phys[k])||!!(GP.held&&GP.held[c]);}}

// ---------------- phone screens ----------------
function kbSysIdx(){const v=phoneViewBase('system');return Math.max(0,v.items.findIndex(it=>/^Controls/.test(it.label)));}

function kbView(v){if(phone.app==='keys'){v.title='CONTROLS';
    v.lines.push(TOUCHUI?'Keyboard keys (touch uses the on-screen buttons).':'Pick an action to change its keys. Esc closes.');if(KB.note)v.lines.push(KB.note);

// ---------------- basic gamepad (standard mapping) ----------------
